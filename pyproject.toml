[project]
name = "pageplus"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"

# Core dependencies
dependencies = [
    "typer>=0.17.3",
    "lxml>=6.0.1",
    "shapely>=2.1.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "urllib3>=2.5.0",
    "openpyxl>=3.1.5",
    "json_repair>=0.50.0",
    "pillow>=11.3.0",
    "langcodes>=3.5.0",
    "chardet>=5.2.0",
    "uniseg>=0.10.0",
    "jinja2>=3.1.6",
    "rapidfuzz>=3.14.0",
    "attrs>=25.3.0",
    "multimethod>=2.0",
    "pikepdf>=10.0.0",
    "google-genai>=1.32.0",
    "aiofiles>=24.1.0",
    "unicodedataplus>=16.0.0.post1",
    "typing-extensions>=4.15.0",
    "aiohttp>=3.13.3",
    "pandas>=2.3.3",
    "streamlit>=1.54.0",
    "pyqt6>=6.10.2",
    "numpy>=2.4.2",
    "scikit-image>=0.26.0",
]


# CLI entry points
[project.scripts]
pageplus = "pageplus.main:app"
install-extras = "tools.install_extras:app"
pageplus-gui = "pageplus.gui.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pageplus"]
